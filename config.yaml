# =============================================================================
# Scientific Literature RAG System — Configuration
# =============================================================================
# All tuneable hyper-parameters live here so experiments are fully reproducible.
# Change values here; no Python file needs to be edited for common experiments.

# ── Reproducibility ───────────────────────────────────────────────────────────
seed: 42

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  papers_dir:    "data/papers"          # raw PDF downloads
  processed_dir: "data/processed"       # extracted text / metadata JSON
  chroma_dir:    "data/chroma_db"       # ChromaDB persistent store
  eval_dir:      "data/evaluation"      # evaluation outputs / logs
  logs_dir:      "logs"

# ── PDF Parsing ───────────────────────────────────────────────────────────────
pdf:
  library: "pdfplumber"                 # "pdfplumber" | "pymupdf"
  remove_references: true              # strip reference section
  remove_headers_footers: true

# ── Chunking ──────────────────────────────────────────────────────────────────
chunking:
  default_strategy: "recursive"        # "fixed" | "recursive" | "section"

  fixed:
    chunk_size: 512                    # characters
    overlap:    64

  recursive:
    chunk_size: 512
    overlap:    64
    separators: ["\n\n", "\n", ". ", " ", ""]

  section:
    header_patterns:
      - "^abstract"
      - "^\\d+\\.?\\s+introduction"
      - "^\\d+\\.?\\s+related work"
      - "^\\d+\\.?\\s+background"
      - "^\\d+\\.?\\s+method"
      - "^\\d+\\.?\\s+approach"
      - "^\\d+\\.?\\s+experiment"
      - "^\\d+\\.?\\s+result"
      - "^\\d+\\.?\\s+discussion"
      - "^\\d+\\.?\\s+conclusion"
    max_section_chunk_size: 800
    overlap: 80

# ── Embedding Models ──────────────────────────────────────────────────────────
embeddings:
  default_model: "all-MiniLM-L6-v2"
  models:
    all-MiniLM-L6-v2:
      hf_name: "sentence-transformers/all-MiniLM-L6-v2"
      dimension: 384
      batch_size: 64
    bge-base-en-v1.5:
      hf_name: "BAAI/bge-base-en-v1.5"
      dimension: 768
      batch_size: 32
    e5-base-v2:
      hf_name: "intfloat/e5-base-v2"
      dimension: 768
      batch_size: 32
      query_prefix:   "query: "
      passage_prefix: "passage: "

# ── ChromaDB ──────────────────────────────────────────────────────────────────
chroma:
  collection_prefix: "sci_rag"
  distance_metric: "cosine"

# ── Retrieval ─────────────────────────────────────────────────────────────────
retrieval:
  top_k: 8
  final_k: 4
  similarity_threshold: 0.30
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  use_reranker: true

# ── Generation ────────────────────────────────────────────────────────────────
generation:
  llm_provider: "extractive"           # "extractive" | "openai" | "gemini" | "huggingface"

  openai:
    model: "gpt-4o"
    temperature: 0.1
    max_tokens: 1024

  gemini:
    model: "gemini-1.5-flash"
    temperature: 0.1
    max_tokens: 1024

  huggingface:
    model: "microsoft/Phi-3-mini-4k-instruct"
    temperature: 0.1
    max_new_tokens: 512
    load_in_4bit: true

# ── Hallucination Control ─────────────────────────────────────────────────────
hallucination:
  entailment_model: "cross-encoder/nli-deberta-v3-small"
  entailment_threshold: 0.5
  flag_unsupported: true

# ── Evaluation ────────────────────────────────────────────────────────────────
evaluation:
  recall_k_values: [1, 3, 5, 10]
  faithfulness_sample_size: 20
  qa_file: "data/evaluation/test_questions.json"
